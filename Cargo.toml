[workspace]
members = [
    "crates/emwin-protocol",
    "crates/emwin-cli",
    "crates/emwin-db",
    "crates/emwin-parser",
]
resolver = "3"

[workspace.package]
edition = "2024"
version = "0.3.0"
rust-version = "1.88"
license = "MIT"
readme = "README.md"
repository = "https://github.com/bradsjm/emwin-rs"
homepage = "https://github.com/bradsjm/emwin-rs"

[workspace.dependencies]
chrono = { version = "0.4", features = ["std", "clock", "serde"], default-features = false }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "io-util", "signal"] }
tokio-util = { version = "0.7", features = ["codec"] }
tokio-stream = "0.1"
bytes = { version = "1", features = ["serde"] }
thiserror = "2"
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", default-features = false, features = ["postgres", "runtime-tokio-rustls", "macros", "migrate", "chrono", "json"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
dotenvy = "0.15"
flate2 = "1"
futures = "0.3"
rust-s3 = { version = "0.37.1", default-features = false, features = ["fail-on-err", "tokio-rustls-tls", "http-credentials"] }
regex = "1"
bstr = "1"
memchr = "2"
url = "2"
winnow = "0.7"
time = { version = "0.3.47", features = ["parsing", "macros"] }
axum = "0.7"
tower-http = { version = "0.5", features = ["cors"] }
tower = "0.5"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rustls-native-certs = "0.8"
base64 = "0.22"
minidom = "0.17"
xmpp-parsers = "0.22"
quick-xml = "0.38"
csv = "1"
crc32fast = "1"

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.dist]
inherits = "release"
