[workspace]
members = [
    "crates/emwin-api",
    "crates/emwin-alert",
    "crates/emwin-live",
    "crates/emwin-protocol",
    "crates/emwin-cli",
    "crates/emwin-db",
    "crates/emwin-service",
    "crates/emwin-parser",
]
resolver = "3"

[workspace.package]
edition = "2024"
version = "0.3.1"
rust-version = "1.94"
license = "MIT"
readme = "README.md"
repository = "https://github.com/bradsjm/emwin-rs"
homepage = "https://github.com/bradsjm/emwin-rs"

[workspace.dependencies]
anyhow = "1"
axum = "0.8"
base64 = "0.22"
bstr = "1"
bytes = { version = "1", features = ["serde"] }
chrono = { version = "0.4", features = ["std", "clock", "serde"], default-features = false }
clap = { version = "4", features = ["derive", "env"] }
crc32fast = "1"
csv = "1"
dotenvy = "0.15"
flate2 = "1"
futures = "0.3"
memchr = "2"
minidom = "0.18"
object_store = { version = "0.13.2", features = ["aws", "http"] }
quick-xml = { version = "0.39", features = ["serialize"] }
regex = "1"
reqwest = { version = "0.13.2", default-features = false, features = ["json", "rustls"] }
reqwest-middleware = { version = "0.5.1", default-features = false, features = ["json", "rustls"] }
reqwest-retry = "0.9.1"
rustls-native-certs = "0.8"
secrecy = "0.10.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_urlencoded = "0.7"
sha2 = "0.10.9"
sqlx = { version = "0.8", default-features = false, features = ["postgres", "runtime-tokio-rustls", "macros", "migrate", "chrono", "json"] }
minijinja = "2.19.0"
hmac = "0.12.1"
thiserror = "2"
time = { version = "0.3.47", features = ["parsing", "macros"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "io-util", "signal"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
tokio-stream = "0.1"
tokio-util = { version = "0.7", features = ["codec"] }
strum = { version = "0.28", features = ["derive"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
utoipa = { version = "5", features = ["axum_extras", "chrono"] }
utoipa-swagger-ui = { version = "9", features = ["axum", "vendored"] }
url = "2"
wiremock = "0.6.5"
winnow = "0.7"
xmpp-parsers = "0.22"
zip = { version = "8", default-features = false, features = ["deflate"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.dist]
inherits = "release"
